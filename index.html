
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowdark Village Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400;1,700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        :root {
            --dossier-bg: #f5f5f5;
            --ink-black: #0c0a09;
            --stone-grey: #44403c;
            --danger-red: #7f1d1d;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background-color: #1c1917;
            color: var(--ink-black);
            min-height: 100vh;
        }

        .medieval-font {
            font-family: 'MedievalSharp', cursive;
        }

        /* Dossier Style */
        .parchment {
            background-color: var(--dossier-bg);
            color: var(--ink-black);
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            border: 1px solid #ddd;
        }

        .dossier-card {
            background-color: #fff;
            border: 4px solid var(--ink-black);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
        }

        /* PRINT SPECIFIC STYLES - STANDARDIZED MARGINS */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            html, body {
                background-color: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
            }

            .no-print {
                display: none !important;
            }

            section {
                page-break-after: always !important;
                break-after: page !important;
                padding: 40px !important; /* Fixed Internal Margin for PDF */
                margin: 0 !important;
                display: flex !important;
                flex-direction: column !important;
                box-sizing: border-box !important;
                height: 297mm !important; /* Fixed Height per Page */
                width: 210mm !important;
                position: relative !important;
                border: none !important;
                background-color: var(--dossier-bg) !important;
            }

            /* Deep Black Pages */
            section.bg-stone-950 {
                background-color: var(--ink-black) !important;
                color: #ef4444 !important;
            }

            .break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Standardized Typography for Print */
            h2 { font-size: 5rem !important; margin-bottom: 1rem !important; }
            h3 { font-size: 2.5rem !important; }
            p { font-size: 1.15rem !important; line-height: 1.5 !important; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
    </style>

  }
}

</head>
<body>
    <div id="root"></div>
</body>
</html>
