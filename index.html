<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowdark Village Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment-bg: #fef3c7;
            --ink-black: #1a1a1a;
            --sepia-border: #d4a373;
            --shadowdark-red: #7f1d1d;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .medieval-font {
            font-family: 'MedievalSharp', cursive;
        }

        .parchment {
            background-color: var(--parchment-bg);
            color: var(--ink-black);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-image: url("https://www.transparenttextures.com/patterns/old-paper.png");
            border: 2px solid var(--sepia-border);
        }

        /* PRINT SPECIFIC STYLES */
        @media print {
            @page {
                size: portrait;
                margin: 0.5in;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            html, body {
                background-color: var(--parchment-bg) !important;
                color: var(--ink-black) !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
            }

            #root {
                width: 100% !important;
                background-color: var(--parchment-bg) !important;
            }

            .no-print {
                display: none !important;
            }

            .parchment {
                background-color: var(--parchment-bg) !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: none !important;
                overflow: visible !important;
                height: auto !important;
                background-image: none !important;
            }

            section {
                page-break-after: always !important;
                break-after: page !important;
                padding: 0 !important;
                margin: 0 !important;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .page-break-before {
                page-break-before: always !important;
                break-before: page !important;
            }

            .break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Fix text colors */
            .text-black { color: #000 !important; }
            .text-stone-500 { color: #666 !important; }
            
            /* Backgrounds for Print */
            .bg-white { background-color: #fff !important; }
            .bg-stone-800 { background-color: #1c1917 !important; }
            .bg-stone-100 { background-color: #f5f5f4 !important; }
            .bg-red-100 { background-color: #fee2e2 !important; }
            .bg-emerald-100 { background-color: #d1fae5 !important; }
            .bg-blue-100 { background-color: #dbeafe !important; }
            .bg-amber-100 { background-color: #fef3c7 !important; }

            /* Grid fixes */
            .grid {
                display: grid !important;
            }

            /* NPC Dossier Print Specifics */
            .npc-card-container {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 2rem !important;
            }

            /* Ensure background color is printed on every page */
            body {
                background-color: var(--parchment-bg) !important;
            }
        }

        /* Smooth scroll etc */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
