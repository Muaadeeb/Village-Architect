<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowdark Village Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment-bg: #fef3c7;
            --ink-black: #1a1a1a;
            --sepia-border: #d4a373;
            --shadowdark-red: #7f1d1d;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .medieval-font {
            font-family: 'MedievalSharp', cursive;
        }

        .parchment {
            background-color: var(--parchment-bg);
            color: var(--ink-black);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-image: url("https://www.transparenttextures.com/patterns/old-paper.png");
            border: 2px solid var(--sepia-border);
        }

        /* Interactive Elements */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.01); }
        }
        .animate-pulse-subtle { animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        /* PRINT SPECIFIC STYLES - Focus on High Quality PDF */
        @media print {
            @page {
                size: portrait;
                margin: 0.4in;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html, body {
                background-color: var(--parchment-bg) !important;
                color: var(--ink-black) !important;
                height: auto !important;
                overflow: visible !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #root {
                width: 100% !important;
                background-color: var(--parchment-bg) !important;
            }

            .no-print {
                display: none !important;
            }

            .parchment {
                background-color: var(--parchment-bg) !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                overflow: visible !important;
                height: auto !important;
                background-image: none !important;
            }

            /* Thematic Container for Print */
            .print-page-border {
                border: 4px double var(--ink-black) !important;
                padding: 1rem !important;
                margin-bottom: 2rem !important;
                background-color: rgba(255,255,255,0.2) !important;
            }

            /* Section Control */
            section {
                page-break-inside: auto !important;
                margin-bottom: 3rem !important;
                padding-bottom: 2rem !important;
                border-bottom: 1px solid rgba(0,0,0,0.1) !important;
            }

            /* Page Breaks for Major Content */
            .page-break-before {
                page-break-before: always !important;
                padding-top: 1rem !important;
            }

            .break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                display: block !important;
            }

            /* Typography */
            h2 { font-size: 4rem !important; line-height: 1 !important; margin-bottom: 1rem !important; }
            h3 { font-size: 2rem !important; margin-top: 1rem !important; border-bottom: 2px solid var(--ink-black) !important; }
            
            /* Table Formatting */
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1px solid rgba(0,0,0,0.15) !important; padding: 6px !important; }
            thead { background-color: rgba(0,0,0,0.05) !important; }

            /* NPC Dossier Print Polish */
            .npc-card-print {
                border: 2px solid var(--sepia-border) !important;
                background-color: white !important;
                margin-bottom: 2rem !important;
            }

            /* Restore the "Old Paper" feel in PDF if possible, otherwise clean sepia */
            body::before {
                content: "";
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background-color: var(--parchment-bg);
                z-index: -10;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
