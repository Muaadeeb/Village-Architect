
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowdark Village Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400;1,700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        :root {
            --dossier-bg: #f5f5f5;
            --ink-black: #0c0a09;
            --stone-grey: #44403c;
            --danger-red: #7f1d1d;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background-color: #1c1917;
            color: var(--ink-black);
            min-height: 100vh;
        }

        .medieval-font {
            font-family: 'MedievalSharp', cursive;
        }

        /* Dossier Style */
        .parchment {
            background-color: var(--dossier-bg);
            color: var(--ink-black);
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            border: 1px solid #ddd;
        }

        .dossier-card {
            background-color: #fff;
            border: 4px solid var(--ink-black);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
        }

        /* PRINT SPECIFIC STYLES - ROBUST PDF GENERATION */
        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            html, body {
                background-color: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
                height: auto !important;
                width: auto !important;
            }

            .no-print {
                display: none !important;
            }

            section {
                page-break-before: always !important;
                break-before: page !important;
                padding: 10px 0 !important;
                margin: 0 !important;
                display: block !important;
                box-sizing: border-box !important;
                height: auto !important;
                min-height: auto !important;
                width: 100% !important;
                position: relative !important;
                border: none !important;
                background-color: transparent !important;
                box-shadow: none !important;
            }

            section:first-of-type {
                page-break-before: avoid !important;
                break-before: avoid !important;
            }

            .parchment {
                background-color: var(--dossier-bg) !important;
                box-shadow: none !important;
                border: none !important;
            }

            /* NPC Specific PDF Shrinking */
            .npc-portrait-wrap {
                width: 120px !important;
                height: 120px !important;
                margin-bottom: 4px !important;
            }
            .npc-section .p-6 {
                padding: 10px !important;
            }
            .npc-section h4 {
                font-size: 2rem !important;
            }
            .npc-section .text-2xl {
                font-size: 1.1rem !important;
                padding: 10px !important;
            }
            .npc-section .grid {
                gap: 8px !important;
            }

            /* Table fixes for long archives */
            table {
                page-break-inside: auto !important;
                width: 100% !important;
            }
            tr {
                page-break-inside: avoid !important;
                page-break-after: auto !important;
            }
            thead {
                display: table-header-group !important;
            }

            .recharts-responsive-container {
                height: 300px !important;
                width: 100% !important;
                display: block !important;
            }

            .break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            section.bg-stone-950 {
                background-color: var(--ink-black) !important;
                color: #ff0000 !important;
                min-height: 260mm !important;
            }

            h2 { font-size: 4rem !important; margin-bottom: 0.5rem !important; }
            h3 { font-size: 2rem !important; }
            p { font-size: 1rem !important; line-height: 1.3 !important; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
