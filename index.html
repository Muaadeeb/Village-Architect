<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowdark Village Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Crimson Pro', serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .medieval-font {
            font-family: 'MedievalSharp', cursive;
        }
        .parchment {
            background-color: #fef3c7;
            color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-image: url("https://www.transparenttextures.com/patterns/old-paper.png");
        }
        
        @media print {
            @page {
                size: portrait;
                margin: 0.5in;
            }
            
            /* High Quality Print Overrides */
            html, body {
                background-color: #fef3c7 !important;
                color: #1a1a1a !important;
                height: auto !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            #root {
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                position: static !important;
            }

            .no-print {
                display: none !important;
            }

            .parchment {
                background-color: #fef3c7 !important;
                box-shadow: none !important;
                border: 1px solid #d4a373 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                overflow: visible !important;
                height: auto !important;
                margin: 0 !important;
                position: static !important;
            }

            .max-w-4xl {
                max-width: 100% !important;
            }

            /* Critical for PDF completeness: prevent truncation */
            .overflow-y-auto, 
            .overflow-hidden,
            .custom-scrollbar {
                overflow: visible !important;
                max-height: none !important;
                height: auto !important;
            }

            /* Smart Page Breaks */
            .break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 2rem !important;
                display: block !important;
            }

            h2, h3, h4 {
                page-break-after: avoid !important;
            }

            section {
                page-break-inside: auto !important;
                page-break-after: auto !important;
                margin-bottom: 3rem !important;
            }

            /* Ensure background images/textures print if supported */
            .parchment::before {
                content: "";
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background-color: #fef3c7;
                z-index: -1;
            }

            /* Table fixes for PDF */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
            }
            
            tr {
                page-break-inside: avoid !important;
            }
        }

        /* UI Animations */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.01); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .matrix-desaturated {
            filter: grayscale(0.6) contrast(0.9);
            opacity: 0.85;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
