<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowdark Village Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment-bg: #fef3c7;
            --ink-black: #1a1a1a;
            --sepia-border: #d4a373;
            --shadowdark-red: #7f1d1d;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .medieval-font {
            font-family: 'MedievalSharp', cursive;
        }

        .parchment {
            background-color: var(--parchment-bg);
            color: var(--ink-black);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-image: url("https://www.transparenttextures.com/patterns/old-paper.png");
            border: 2px solid var(--sepia-border);
        }

        /* PRINT SPECIFIC STYLES - CRITICAL FOR PDF QUALITY */
        @media print {
            @page {
                size: portrait;
                margin: 0.5in; /* AGREED MARGIN */
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            html, body {
                background-color: var(--parchment-bg) !important;
                color: #000 !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
            }

            #root {
                width: 100% !important;
            }

            .no-print {
                display: none !important;
            }

            .parchment {
                background-color: var(--parchment-bg) !important;
                box-shadow: none !important;
                border: 1px solid #000 !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                overflow: visible !important;
                height: auto !important;
                background-image: none !important;
            }

            section {
                page-break-after: always !important;
                break-after: page !important;
                padding: 0.25in !important; /* AGREED PADDING */
                margin: 0 !important;
                display: block !important;
                box-sizing: border-box !important;
                min-height: auto !important; /* REMOVED FORCED HEIGHT */
            }

            .page-break-before {
                page-break-before: always !important;
                break-before: page !important;
            }

            .break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Adjust text sizes for print legibility */
            h2 { font-size: 3.5rem !important; }
            h3 { font-size: 2rem !important; }
            p { font-size: 1rem !important; line-height: 1.3 !important; }

            .grid {
                display: grid !important;
            }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
